name: PermaDeathDifficultySystem
version: '${version}'
description: A progressive 35-day hardcore difficulty system with missions, relics, custom AI, and boss encounters.

main: me.pirot.permaDeathDifficultySystem.PermaDeathDifficultySystem
api-version: '1.19'
load: POSTWORLD

authors: [ Pirot ]

commands:
  pdds:
    description: PermaDeath Difficulty System admin commands
    usage: /pdds <subcommand> [args]
    aliases: [permadeath, pds]

permissions:
  # Umbrella node. Granting this grants every child below it.
  pdds.admin:
    description: Full admin access to all PDDS commands
    default: op
    children:
      pdds.admin.day: true
      pdds.admin.penalty: true
      pdds.admin.relic: true
      pdds.admin.mission: true
      pdds.admin.reload: true
  pdds.admin.day:
    description: View, set and advance the global day
    default: op
  pdds.admin.penalty:
    description: Apply, remove and list player penalties
    default: op
  pdds.admin.relic:
    description: Give relics and list the relic registry
    default: op
  pdds.admin.mission:
    description: Inspect, force-complete and reset player missions
    default: op
  pdds.admin.reload:
    description: Reload the plugin configuration
    default: op
  pdds.mission.status:
    description: View your own mission status
    default: true
  pdds.use:
    description: Basic PDDS info commands
    default: true
