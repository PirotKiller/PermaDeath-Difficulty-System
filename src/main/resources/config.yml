# ================================
# PermaDeath Difficulty System
# Configuration File
# ================================

general:
  # Current day in the 35-day progression (1-35)
  current-day: 1
  # Duration of each "day" in real-time minutes (default: 60)
  day-duration-minutes: 60
  # Whether the day automatically advances after the duration expires
  auto-advance: true
  # Whether day effects are cumulative (Day N includes Days 1 through N-1)
  cumulative-effects: true
  # Broadcast messages when day advances
  broadcast-day-change: true

